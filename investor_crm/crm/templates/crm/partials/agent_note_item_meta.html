{# Shared date / source / edit controls under a finding. Expects: note; optional clear_confirm, compact #}
<div class="{% if not compact %}mt-2 {% endif %}flex flex-wrap items-center gap-x-3 gap-y-2">
  {% if note.event_date %}
    <span class="text-grey text-table-header">{{ note.event_date|date:"j M Y" }}</span>
  {% endif %}
  {% if note.link %}
    <a href="{{ note.link }}" target="_blank" rel="noopener"
       class="inline-flex items-center gap-1 px-2 py-1 rounded-tag bg-accent/10 text-accent border border-accent/30 text-table-header font-medium hover:bg-accent/20">
      Source ↗
    </a>
  {% endif %}
  {% if can_write or note.author_id == user.id %}
    <button type="button"
            class="inline-flex items-center px-2 py-1 rounded-tag text-grey hover:text-accent hover:bg-grey-hover text-table-header font-medium"
            hx-get="{% url 'crm:agent_note_edit' note.pk %}"
            hx-target="#modal-container"
            hx-swap="innerHTML">Edit</button>
    <form method="post" action="{% url 'crm:agent_note_delete' note.pk %}" class="inline-flex items-center"
          {% if clear_inplace %}
          hx-post="{% url 'crm:agent_note_delete' note.pk %}"
          hx-target="#agent-note-{{ note.pk }}"
          hx-swap="delete"
          hx-confirm="{{ clear_confirm|default:'Clear this flag?' }}"
          hx-on::after-request="if (event.detail.successful) { var dialog = document.getElementById('agent-note-dialog-{{ note.pk }}'); if (dialog) dialog.remove(); }"
          {% else %}
          onsubmit="return confirm('{{ clear_confirm|default:"Delete this finding?" }}');"
          {% endif %}>
      {% csrf_token %}
      <button type="submit"
              class="inline-flex items-center px-2 py-1 rounded-tag text-grey hover:text-danger hover:bg-grey-hover text-table-header font-medium">
        {{ clear_label|default:"Delete" }}
      </button>
    </form>
  {% endif %}
</div>
