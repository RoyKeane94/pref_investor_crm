{# Shared date / source / edit controls under a finding. Expects: note; optional clear_confirm, compact #}
<div class="{% if not compact %}mt-2.5 {% endif %}flex flex-wrap items-center gap-x-3 gap-y-1.5">
  {% if note.event_date %}
    <span class="text-grey text-table-header leading-none">{{ note.event_date|date:"j M Y" }}</span>
  {% endif %}
  {% if note.link %}
    <a href="{{ note.link }}" target="_blank" rel="noopener"
       class="inline-flex items-center gap-1 px-2 py-1 rounded-tag bg-accent/10 text-accent border border-accent/30 text-table-header font-medium hover:bg-accent/20 leading-none">
      Source ↗
    </a>
  {% endif %}
  {% if can_write or note.author_id == user.id %}
    <button type="button"
            class="inline-flex items-center px-2 py-1 rounded-tag text-grey hover:text-accent hover:bg-grey-hover text-table-header font-medium leading-none"
            hx-get="{% url 'crm:agent_note_edit' note.pk %}"
            hx-target="#modal-container"
            hx-swap="innerHTML">Edit</button>
    <form method="post" action="{% url 'crm:agent_note_delete' note.pk %}" class="inline-flex items-center"
          onsubmit="return confirm('{{ clear_confirm|default:"Delete this finding?" }}');">
      {% csrf_token %}
      <button type="submit"
              class="inline-flex items-center px-2 py-1 rounded-tag text-grey hover:text-danger hover:bg-grey-hover text-table-header font-medium leading-none">
        {{ clear_label|default:"Delete" }}
      </button>
    </form>
  {% endif %}
</div>
