{# Expandable flag / fit reason bubble. Expects: note, label, label_class, bubble_class, empty_fallback; optional clear_confirm, clear_label #}
<li class="{{ bubble_class }}" x-data="{ open: false }">
  <button
    type="button"
    class="w-full text-left group cursor-pointer"
    @click="open = true"
    aria-haspopup="dialog">
    <div class="flex items-center justify-between gap-3 mb-2">
      <div class="text-table-header uppercase {{ label_class }} font-medium">{{ label }}</div>
      <span class="text-table-header text-grey shrink-0 opacity-70 group-hover:opacity-100 group-hover:text-navy">
        Expand
      </span>
    </div>
    <div class="text-navy font-medium">
      {% if note.title %}{{ note.title }}{% elif note.body %}{{ note.body|truncatechars:160 }}{% else %}{{ empty_fallback }}{% endif %}
    </div>
    {% if note.body and note.title %}
      <div class="text-navy/80 mt-1">{{ note.body|truncatechars:200 }}</div>
    {% endif %}
  </button>
  {% include "crm/partials/agent_note_item_meta.html" with note=note clear_confirm=clear_confirm clear_label=clear_label %}

  <template x-teleport="body">
    <div
      x-show="open"
      x-cloak
      x-transition.opacity.duration.150ms
      class="fixed inset-0 bg-navy/40 backdrop-blur flex items-center justify-center z-50 p-4"
      role="dialog"
      aria-modal="true"
      @keydown.escape.window="if (open) open = false"
      @click.self="open = false">
      <div
        class="bg-white rounded-modal shadow-xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto"
        @click.stop>
        <div class="flex items-start justify-between gap-3 mb-4">
          <h2 class="text-heading {{ label_class }}">{{ label }}</h2>
          <button
            type="button"
            class="text-grey text-body-sm hover:text-navy shrink-0 px-1"
            @click="open = false"
            aria-label="Close">
            ×
          </button>
        </div>
        {% if note.title %}
          <div class="text-navy font-medium text-body-sm whitespace-pre-wrap">{{ note.title }}</div>
        {% endif %}
        {% if note.body %}
          <div class="{% if note.title %}text-navy/80 mt-4{% else %}text-navy{% endif %} text-body-sm whitespace-pre-wrap">{{ note.body }}</div>
        {% elif not note.title %}
          <div class="text-navy text-body-sm">{{ empty_fallback }}</div>
        {% endif %}
        <div class="mt-6 pt-4 border-t border-grey-border flex flex-wrap items-center justify-between gap-3">
          {% include "crm/partials/agent_note_item_meta.html" with note=note clear_confirm=clear_confirm clear_label=clear_label compact=1 %}
          <button
            type="button"
            class="px-3 py-1.5 rounded-badge border border-grey-border text-navy text-body-sm hover:bg-grey-hover bg-white shrink-0"
            @click="open = false">
            Close
          </button>
        </div>
      </div>
    </div>
  </template>
</li>
